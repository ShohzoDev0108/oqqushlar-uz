{% load i18n %}
{% trans "Baxtli oilamizga" as SO_BAXTLI %}
{% trans "yil" as SO_YIL %}
{% trans "kun" as SO_KUN %}
{% trans "bo'ldi" as SO_BOLDI %}
{% trans "Marosimgacha" as SO_MAROSIMGACHA %}
<script>
(function () {
    var SO = {
        baxtli: "{{ SO_BAXTLI|escapejs }}",
        yil: "{{ SO_YIL|escapejs }}",
        kun: "{{ SO_KUN|escapejs }}",
        boldi: "{{ SO_BOLDI|escapejs }}",
        marosimgacha: "{{ SO_MAROSIMGACHA|escapejs }}"
    };

    // 3D konvert-ochilish pardasi va musiqa
    var parda = document.getElementById('parda');
    var konvert = document.getElementById('konvert');
    var tugma = document.getElementById('ochish-tugma');
    var musiqa = document.getElementById('fon-musiqa');
    var musiqaTugma = document.getElementById('musiqa-tugma');

    function musiqaniIjroEt() {
        if (!musiqa) { return; }
        var ijro = musiqa.play();
        if (ijro && ijro.catch) {
            ijro.catch(function (xato) {
                console.warn('Musiqani avtomatik ijro etib bo\'lmadi:', xato);
                if (musiqaTugma) { musiqaTugma.classList.add('ochirilgan'); }
            });
        }
    }

    if (tugma) {
        tugma.addEventListener('click', function () {
            // Avval konvert ochiladi (3D animatsiya), keyin parda yo'qoladi
            if (konvert) { konvert.classList.add('ochildi'); }
            tugma.classList.add('yashirin');
            setTimeout(function () {
                parda.classList.add('yopilgan');
            }, konvert ? 1500 : 0);
            if (musiqa && musiqaTugma) {
                musiqaTugma.classList.add('korinadi');
                musiqaniIjroEt();
            }
        });
    }

    if (musiqaTugma) {
        musiqaTugma.addEventListener('click', function () {
            if (musiqa.paused) {
                musiqaniIjroEt();
                musiqaTugma.textContent = '🎵';
                musiqaTugma.classList.remove('ochirilgan');
            } else {
                musiqa.pause();
                musiqaTugma.textContent = '🔇';
            }
        });
    }

    // Countdown — kelajakda qolgan vaqt, o'tgan bo'lsa o'tgan vaqtni sanaydi
    var el = document.getElementById('countdown');
    var target = new Date(el.dataset.sana).getTime();
    var matnEl = document.getElementById('countdown-matn');

    function tick() {
        var endi = new Date().getTime();
        var farq = target - endi;

        if (farq <= 0) {
            var otgan = endi - target;
            var kun = Math.floor(otgan / 86400000);
            var soat = Math.floor((otgan % 86400000) / 3600000);
            var minut = Math.floor((otgan % 3600000) / 60000);
            var sekund = Math.floor((otgan % 60000) / 1000);
            var yil = Math.floor(kun / 365);
            document.getElementById('kun').textContent = kun;
            document.getElementById('soat').textContent = soat;
            document.getElementById('minut').textContent = minut;
            document.getElementById('sekund').textContent = sekund;
            matnEl.textContent = yil > 0
                ? SO.baxtli + ": " + yil + " " + SO.yil + " " + (kun % 365) + " " + SO.kun + " " + SO.boldi
                : SO.baxtli + ": " + kun + " " + SO.kun + " " + SO.boldi;
            return;
        }

        document.getElementById('kun').textContent = Math.floor(farq / 86400000);
        document.getElementById('soat').textContent = Math.floor((farq % 86400000) / 3600000);
        document.getElementById('minut').textContent = Math.floor((farq % 3600000) / 60000);
        document.getElementById('sekund').textContent = Math.floor((farq % 60000) / 1000);
        matnEl.textContent = SO.marosimgacha;
    }
    tick();
    setInterval(tick, 1000);

    // Marosim kalendari — sana yurakcha bilan belgilanadi (dushanbadan boshlanadi)
    var kalendar = document.getElementById('kalendar-grid');
    if (kalendar) {
        var kSana = new Date(kalendar.dataset.sana);
        var kYil = kSana.getFullYear(), kOy = kSana.getMonth();
        var hafta = (kalendar.dataset.hafta || 'Du Se Ch Pa Ju Sh Ya').split(' ');
        var ichki = '';
        for (var hi = 0; hi < 7; hi++) {
            ichki += '<span class="k-kun k-sarlavha">' + (hafta[hi] || '') + '</span>';
        }
        var boshJoy = (new Date(kYil, kOy, 1).getDay() + 6) % 7;
        var oyKunlari = new Date(kYil, kOy + 1, 0).getDate();
        for (var bj = 0; bj < boshJoy; bj++) { ichki += '<span class="k-kun"></span>'; }
        for (var kk = 1; kk <= oyKunlari; kk++) {
            var tanlangan = kk === kSana.getDate();
            ichki += '<span class="k-kun' + (tanlangan ? ' k-tanlangan' : '') + '">' + kk + (tanlangan ? '<i>♥</i>' : '') + '</span>';
        }
        kalendar.innerHTML = ichki;
    }

    // RSVP: mehmonlar soni hisoblagichi (1..5)
    var soniInput = document.getElementById('mehmonlar_soni');
    var soniKorsatkich = document.getElementById('soni-korsatkich');
    if (soniInput && soniKorsatkich) {
        document.querySelectorAll('.soni-tugma').forEach(function (t) {
            t.addEventListener('click', function () {
                var qiymat = parseInt(soniInput.value, 10) + parseInt(t.dataset.yon, 10);
                qiymat = Math.max(1, Math.min(5, qiymat));
                soniInput.value = qiymat;
                soniKorsatkich.textContent = qiymat;
            });
        });
    }

    // RSVP: "Kelaman / Kela olmayman" tugmalari
    var keladiInput = document.getElementById('keladi');
    if (keladiInput) {
        document.querySelectorAll('.keladi-tugma').forEach(function (t) {
            t.addEventListener('click', function () {
                document.querySelectorAll('.keladi-tugma').forEach(function (b) { b.classList.remove('faol'); });
                t.classList.add('faol');
                keladiInput.value = t.dataset.qiymat;
            });
        });
    }

    // Havolani nusxalash
    var nusxaTugma = document.getElementById('havola-nusxa');
    if (nusxaTugma) {
        nusxaTugma.addEventListener('click', function () {
            var havola = nusxaTugma.dataset.havola;
            var tayyor = function () { nusxaTugma.textContent = '✓ ' + nusxaTugma.dataset.nusxalandi; };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(havola).then(tayyor);
            } else {
                var vaqtinchalik = document.createElement('input');
                vaqtinchalik.value = havola;
                document.body.appendChild(vaqtinchalik);
                vaqtinchalik.select();
                document.execCommand('copy');
                document.body.removeChild(vaqtinchalik);
                tayyor();
            }
        });
    }

    // Scroll-animatsiya
    var bolimlar = document.querySelectorAll('[data-anim]');
    if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('korindi');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        bolimlar.forEach(function (b) { observer.observe(b); });
    } else {
        bolimlar.forEach(function (b) { b.classList.add('korindi'); });
    }
})();
</script>
