{% load i18n %}
{% trans "Baxtli oilamizga" as SO_BAXTLI %}
{% trans "yil" as SO_YIL %}
{% trans "oy" as SO_OY %}
{% trans "kun" as SO_KUN %}
{% trans "bo'ldi" as SO_BOLDI %}
{% trans "Marosimgacha" as SO_MAROSIMGACHA %}
{% trans "Bugun — bizning eng baxtli kunimiz" as SO_BUGUN %}
<script>
(function () {
    var SO = {
        baxtli: "{{ SO_BAXTLI|escapejs }}",
        yil: "{{ SO_YIL|escapejs }}",
        oy: "{{ SO_OY|escapejs }}",
        kun: "{{ SO_KUN|escapejs }}",
        boldi: "{{ SO_BOLDI|escapejs }}",
        marosimgacha: "{{ SO_MAROSIMGACHA|escapejs }}",
        bugun: "{{ SO_BUGUN|escapejs }}"
    };

    // 3D konvert-ochilish pardasi va musiqa.
    // Til almashtirilganda sahifa qayta yuklanadi — shunda konvert qayta
    // ochtirilmaydi va musiqa to'xtagan joyidan davom etadi (sessionStorage).
    var parda = document.getElementById('parda');
    var konvert = document.getElementById('konvert');
    var tugma = document.getElementById('ochish-tugma');
    var musiqa = document.getElementById('fon-musiqa');
    var musiqaTugma = document.getElementById('musiqa-tugma');

    var OCHILDI_KALITI = 'taklif_ochildi_' + location.pathname;
    var MUSIQA_KALITI = 'taklif_musiqa_' + location.pathname;

    function musiqaniIjroEt() {
        if (!musiqa) { return; }
        var ijro = musiqa.play();
        if (ijro && ijro.catch) {
            ijro.catch(function (xato) {
                console.warn('Musiqani avtomatik ijro etib bo\'lmadi:', xato);
                if (musiqaTugma) { musiqaTugma.classList.add('ochirilgan'); musiqaTugma.textContent = '🔇'; }
            });
        }
    }

    function musiqaHolatiniSaqla() {
        if (!musiqa) { return; }
        try {
            sessionStorage.setItem(MUSIQA_KALITI, JSON.stringify({
                vaqt: musiqa.currentTime || 0,
                ochirilgan: musiqa.paused
            }));
        } catch (e) {}
    }

    function vaqtniTikla(vaqt) {
        // Audio metadata hali yuklanmagan bo'lsa, currentTime o'rnatish ishlamaydi —
        // shuning uchun tayyor bo'lishini kutamiz.
        var qoy = function () { try { musiqa.currentTime = vaqt; } catch (e) {} };
        if (musiqa.readyState >= 1) { qoy(); }
        else { musiqa.addEventListener('loadedmetadata', qoy, { once: true }); }
    }

    var avvalOchilgan = false;
    try { avvalOchilgan = sessionStorage.getItem(OCHILDI_KALITI) === '1'; } catch (e) {}

    if (avvalOchilgan && parda) {
        // Shu sessiyada konvert allaqachon ochilgan (masalan, til almashtirildi) —
        // pardani animatsiyasiz darhol o'tkazib yuboramiz.
        parda.style.transition = 'none';
        parda.classList.add('yopilgan');
        if (musiqa && musiqaTugma) {
            musiqaTugma.classList.add('korinadi');
            if (!musiqa.paused && musiqa.currentTime > 0) {
                // Audio allaqachon ijroda (sahifa yangilanmasdan almashtirilgan) — tegmaymiz.
                musiqaTugma.textContent = '🎵';
            } else {
                var holat = null;
                try { holat = JSON.parse(sessionStorage.getItem(MUSIQA_KALITI) || 'null'); } catch (e) {}
                if (holat && holat.vaqt) { vaqtniTikla(holat.vaqt); }
                if (!holat || !holat.ochirilgan) {
                    musiqaniIjroEt();
                } else {
                    musiqaTugma.textContent = '🔇';
                }
            }
        }
    }

    // Til almashtirish — sahifani TO'LIQ QAYTA YUKLAMASDAN: yangi tildagi
    // sahifa fon rejimida yuklab olinadi va tana almashtiriladi; ijrodagi
    // audio element esa yangi tanaga jonli ko'chiriladi — musiqa uzilmaydi.
    var tilForma = document.querySelector('.til-qatori .til-forma');
    if (tilForma && window.fetch && window.DOMParser) {
        var tilSelect = tilForma.querySelector('select');
        tilSelect.removeAttribute('onchange');
        tilSelect.addEventListener('change', function () {
            var yubor = new FormData(tilForma);
            fetch(tilForma.action, { method: 'POST', body: yubor, credentials: 'same-origin' })
                .then(function () { return fetch(location.href, { credentials: 'same-origin' }); })
                .then(function (javob) { return javob.text(); })
                .then(function (matn) {
                    var yangiHujjat = new DOMParser().parseFromString(matn, 'text/html');
                    document.title = yangiHujjat.title;
                    var yangiTana = document.adoptNode(yangiHujjat.body);
                    // Ijrodagi audio elementni yangi tanaga ko'chiramiz (to'xtamaydi)
                    var jonliAudio = document.getElementById('fon-musiqa');
                    if (jonliAudio) {
                        var yangiAudio = yangiTana.querySelector('#fon-musiqa');
                        if (yangiAudio) { yangiAudio.parentNode.replaceChild(jonliAudio, yangiAudio); }
                    }
                    var joriyScroll = window.scrollY;
                    // Eski taymerlarni tozalaymiz (countdown va h.k. ikkilanmasligi uchun)
                    var oxirgiId = setTimeout(function () {}, 0);
                    for (var ti = 1; ti <= oxirgiId; ti++) { clearTimeout(ti); clearInterval(ti); }
                    document.body.parentNode.replaceChild(yangiTana, document.body);
                    // Yangi tanadagi skriptlarni qayta ishga tushiramiz
                    Array.prototype.slice.call(document.body.querySelectorAll('script')).forEach(function (eski) {
                        var yangi = document.createElement('script');
                        yangi.textContent = eski.textContent;
                        eski.parentNode.replaceChild(yangi, eski);
                    });
                    window.scrollTo(0, joriyScroll);
                })
                .catch(function () { tilForma.submit(); });
        });
    }

    if (musiqa) {
        setInterval(musiqaHolatiniSaqla, 1000);
        window.addEventListener('pagehide', musiqaHolatiniSaqla);
    }

    if (tugma) {
        tugma.addEventListener('click', function () {
            // Avval konvert ochiladi (3D animatsiya), keyin parda yo'qoladi
            if (konvert) { konvert.classList.add('ochildi'); }
            tugma.classList.add('yashirin');
            // Kabutarli dizaynlarda (agar mavjud bo'lsa) — kabutarlar va
            // osma (qulf/maktub) qulf-kalit animatsiyasi bilan PARALLEL
            // ravishda uchib/tushib ketadi (CSS: .parda-kabutarlar.yashirin).
            var kabutarlar = document.querySelector('.parda-kabutarlar');
            if (kabutarlar) { kabutarlar.classList.add('yashirin'); }
            setTimeout(function () {
                parda.classList.add('yopilgan');
            }, konvert ? 1500 : 0);
            try { sessionStorage.setItem(OCHILDI_KALITI, '1'); } catch (e) {}
            if (musiqa && musiqaTugma) {
                musiqaTugma.classList.add('korinadi');
                musiqaniIjroEt();
            }
        });
    }

    if (musiqaTugma) {
        musiqaTugma.addEventListener('click', function () {
            if (musiqa.paused) {
                musiqaniIjroEt();
                musiqaTugma.textContent = '🎵';
                musiqaTugma.classList.remove('ochirilgan');
            } else {
                musiqa.pause();
                musiqaTugma.textContent = '🔇';
            }
            musiqaHolatiniSaqla();
        });
    }

    if (musiqa) {
        musiqa.addEventListener('play', function () {
            if (musiqaTugma) { musiqaTugma.textContent = '🎵'; musiqaTugma.classList.remove('ochirilgan'); }
        });
    }

    // Countdown — kelajakda qolgan vaqt, o'tgan bo'lsa taqvimga mos (yil/oy/kun)
    // aniq farqni chiroyli, bayramona matn bilan ko'rsatadi.
    var el = document.getElementById('countdown');
    var target = new Date(el.dataset.sana).getTime();
    var matnEl = document.getElementById('countdown-matn');
    var taymerId = null;

    // Ikki sana orasidagi taqvim jihatidan aniq farq (oddiy "kun / 365"
    // taxminidan farqli — oy uzunliklari va kabisa yillarini hisobga oladi).
    function taqvimFarqi(dan, gacha) {
        var yil = gacha.getFullYear() - dan.getFullYear();
        var oy = gacha.getMonth() - dan.getMonth();
        var kun = gacha.getDate() - dan.getDate();
        if (kun < 0) {
            oy--;
            kun += new Date(gacha.getFullYear(), gacha.getMonth(), 0).getDate();
        }
        if (oy < 0) { oy += 12; yil--; }
        return { yil: yil, oy: oy, kun: kun };
    }

    function tick() {
        var endi = new Date();
        var farq = target - endi.getTime();

        if (farq <= 0) {
            var f = taqvimFarqi(new Date(target), endi);
            if (f.yil === 0 && f.oy === 0 && f.kun === 0) {
                matnEl.textContent = SO.bugun;
            } else {
                var qismlar = [];
                if (f.yil > 0) { qismlar.push(f.yil + ' ' + SO.yil); }
                if (f.oy > 0) { qismlar.push(f.oy + ' ' + SO.oy); }
                if (f.kun > 0) { qismlar.push(f.kun + ' ' + SO.kun); }
                matnEl.textContent = SO.baxtli + ': ' + qismlar.join(' ') + ' ' + SO.boldi;
            }
            matnEl.classList.add('baxtli');
            if (el) { el.classList.add('otgan'); }
            if (taymerId) { clearInterval(taymerId); taymerId = null; }
            return;
        }

        document.getElementById('kun').textContent = Math.floor(farq / 86400000);
        document.getElementById('soat').textContent = Math.floor((farq % 86400000) / 3600000);
        document.getElementById('minut').textContent = Math.floor((farq % 3600000) / 60000);
        document.getElementById('sekund').textContent = Math.floor((farq % 60000) / 1000);
        matnEl.textContent = SO.marosimgacha;
    }
    tick();
    taymerId = setInterval(tick, 1000);

    // Marosim kalendari — sana yurakcha bilan belgilanadi (dushanbadan boshlanadi)
    var kalendar = document.getElementById('kalendar-grid');
    if (kalendar) {
        var kSana = new Date(kalendar.dataset.sana);
        var kYil = kSana.getFullYear(), kOy = kSana.getMonth();
        var hafta = (kalendar.dataset.hafta || 'Du Se Ch Pa Ju Sh Ya').split(' ');
        var ichki = '';
        for (var hi = 0; hi < 7; hi++) {
            ichki += '<span class="k-kun k-sarlavha">' + (hafta[hi] || '') + '</span>';
        }
        var boshJoy = (new Date(kYil, kOy, 1).getDay() + 6) % 7;
        var oyKunlari = new Date(kYil, kOy + 1, 0).getDate();
        for (var bj = 0; bj < boshJoy; bj++) { ichki += '<span class="k-kun"></span>'; }
        for (var kk = 1; kk <= oyKunlari; kk++) {
            var tanlangan = kk === kSana.getDate();
            ichki += '<span class="k-kun' + (tanlangan ? ' k-tanlangan' : '') + '">' + (tanlangan ? '<span>' + kk + '</span>' : kk) + '</span>';
        }
        kalendar.innerHTML = ichki;
    }

    // RSVP: mehmonlar soni hisoblagichi (1..5)
    var soniInput = document.getElementById('mehmonlar_soni');
    var soniKorsatkich = document.getElementById('soni-korsatkich');
    if (soniInput && soniKorsatkich) {
        document.querySelectorAll('.soni-tugma').forEach(function (t) {
            t.addEventListener('click', function () {
                var qiymat = parseInt(soniInput.value, 10) + parseInt(t.dataset.yon, 10);
                qiymat = Math.max(1, Math.min(5, qiymat));
                soniInput.value = qiymat;
                soniKorsatkich.textContent = qiymat;
            });
        });
    }

    // RSVP: "Kelaman / Kela olmayman" tugmalari
    var keladiInput = document.getElementById('keladi');
    if (keladiInput) {
        document.querySelectorAll('.keladi-tugma').forEach(function (t) {
            t.addEventListener('click', function () {
                document.querySelectorAll('.keladi-tugma').forEach(function (b) { b.classList.remove('faol'); });
                t.classList.add('faol');
                keladiInput.value = t.dataset.qiymat;
            });
        });
    }

    // Havolani nusxalash
    var nusxaTugma = document.getElementById('havola-nusxa');
    if (nusxaTugma) {
        nusxaTugma.addEventListener('click', function () {
            var havola = nusxaTugma.dataset.havola;
            var tayyor = function () { nusxaTugma.textContent = '✓ ' + nusxaTugma.dataset.nusxalandi; };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(havola).then(tayyor);
            } else {
                var vaqtinchalik = document.createElement('input');
                vaqtinchalik.value = havola;
                document.body.appendChild(vaqtinchalik);
                vaqtinchalik.select();
                document.execCommand('copy');
                document.body.removeChild(vaqtinchalik);
                tayyor();
            }
        });
    }

    // Scroll-animatsiya
    var bolimlar = document.querySelectorAll('[data-anim]');
    if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('korindi');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        bolimlar.forEach(function (b) { observer.observe(b); });
    } else {
        bolimlar.forEach(function (b) { b.classList.add('korindi'); });
    }
})();
</script>
