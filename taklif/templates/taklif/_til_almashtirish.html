{% load i18n %}
{% comment %}
Til tanlash — to'liq maxsus (custom) dropdown.

Haqiqiy <select name="language"> DOM'da SAQLANIB QOLADI (faqat ko'zga
ko'rinmas holda) — bosilganda haqiqiy <select>'ning qiymatini
o'zgartirib, unga "change" hodisasini yuboradi, xuddi foydalanuvchi
native select'ni o'zi o'zgartirgandek. Shu <select>'ning "change"
hodisasini pastdagi skript (umumiy sayt sahifalarida) HAM, taklifnoma
shablon sahifalarida (_skript.html) HAM kuzatadi — ikkalasi ham tilni
AJAX orqali (sahifani to'liq qayta yuklamasdan, fon musiqasi
uzilmasdan, skroll pozitsiyasi saqlanib) almashtiradi. Ikkalasi bir
sahifada ikki marta ishga tushmasligi uchun pastdagi skript ATAYLAB
".til-qatori" ichidagi (shablon sahifalar) formalarni o'tkazib
yuboradi — ular _skript.html'ning o'z ulanishiga tegishli.
{% endcomment %}
<form action="{% url 'set_language' %}" method="post" class="til-forma">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.path }}">

    <div class="til-dropdown">
        <select name="language" id="til-tanlash" class="til-tabiiy" tabindex="-1" aria-hidden="true">
            {% for til_kodi, til_nomi in TIL_ROYXATI %}
            <option value="{{ til_kodi }}" {% if til_kodi == JORIY_TIL_KODI %}selected{% endif %}>{{ til_nomi }}</option>
            {% endfor %}
        </select>

        <button type="button" class="til-tugma" aria-haspopup="listbox" aria-expanded="false" aria-label="{% trans 'Tilni tanlang' %}">
            <svg class="til-globus" viewBox="0 0 532 532" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="translate(0.000000,532.000000) scale(0.100000,-0.100000)" fill="currentColor"><path d="M2540 5040 c-231 -14 -398 -47 -625 -122 -188 -62 -309 -115 -437 -191 -20 -12 -63 -38 -95 -57 -203 -120 -537 -436 -676 -640 -66 -97 -113 -168 -123 -185 -6 -11 -20 -37 -32 -57 -49 -87 -98 -189 -122 -258 -5 -14 -21 -56 -35 -95 -64 -170 -109 -383 -130 -615 -15 -159 -15 -192 -1 -365 24 -288 59 -439 162 -700 68 -175 109 -260 162 -345 59 -93 134 -204 146 -215 6 -5 43 -48 83 -95 150 -177 339 -353 463 -428 27 -17 87 -56 150 -97 57 -38 239 -128 325 -162 322 -126 570 -174 913 -175 215 0 317 10 527 53 94 20 127 29 285 80 299 97 572 253 830 475 259 223 500 560 623 874 56 141 117 336 117 372 0 11 7 43 15 71 22 80 45 312 45 460 0 150 -24 405 -45 482 -7 28 -21 84 -30 125 -69 301 -247 647 -476 927 -300 365 -732 657 -1174 791 -258 78 -551 110 -845 92z m45 -736 l0 -539 -85 3 c-122 4 -419 48 -530 78 -52 14 -121 31 -153 39 -92 21 -102 37 -67 102 11 21 20 43 20 50 0 11 23 57 102 204 85 158 287 394 402 471 95 63 270 141 301 134 7 -2 10 -191 10 -542z m379 481 c50 -25 111 -57 135 -72 75 -45 221 -200 300 -318 104 -155 246 -440 235 -470 -4 -8 -25 -20 -48 -26 -22 -6 -70 -19 -106 -30 -103 -30 -188 -48 -300 -64 -58 -9 -113 -18 -122 -21 -36 -11 -254 -21 -270 -13 -16 8 -17 50 -18 532 0 288 3 527 7 531 16 16 100 -6 187 -49z m-973 -85 c-83 -83 -217 -262 -238 -317 -4 -10 -21 -40 -38 -68 -31 -49 -135 -257 -155 -309 -5 -14 -14 -26 -18 -26 -15 0 -179 75 -265 120 -43 23 -97 51 -120 63 -61 32 -59 49 15 118 190 179 469 351 693 428 33 12 85 30 115 40 30 11 56 16 58 11 2 -5 -19 -32 -47 -60z m1405 49 c32 -11 77 -26 99 -33 92 -31 326 -154 440 -232 145 -100 325 -249 325 -271 0 -9 -130 -93 -225 -144 -72 -40 -207 -91 -214 -83 -5 5 -23 43 -41 84 -108 249 -267 496 -409 635 -74 71 -70 78 25 44z m-2373 -713 c18 -14 79 -48 137 -76 58 -28 114 -56 124 -62 10 -5 55 -26 100 -44 45 -19 86 -41 92 -50 9 -11 7 -31 -8 -135 -25 -30 -7 -111 -26 -180 -41 -69 -15 -138 -33 -153 -41 -16 -8 -42 -13 -59 -11 -29 3 -32 7 -44 58 -6 30 -25 107 -41 170 -17 63 -33 138 -37 165 -4 28 -13 82 -21 120 -15 73 -45 371 -45 441 0 22 3 44 7 47 3 4 248 6 542 5 l536 -3 3 -419z m-2 -618 c5 -7 8 -249 6 -537 l-2 -523 -48 7 c-56 8 -160 57 -251 119 -128 87 -306 285 -401 446 -53 90 -120 220 -120 233 0 7 -9 29 -20 50 -11 21 -18 43 -14 48 25 40 509 143 764 162 25 2 52 4 61 5 9 1 20 -4 25 -10z m486 -19 c180 -24 341 -60 508 -112 40 -13 45 -18 44 -43 -3 -54 -150 -336 -233 -447 -156 -208 -303 -335 -466 -401 -77 -31 -131 -41 -140 -27 -8 15 -19 1026 -11 1048 7 18 53 15 298 -18z m817 -223 c25 -13 117 -58 204 -101 87 -42 161 -83 164 -92 6 -15 -32 -56 -123 -133 -41 -35 -171 -128 -246 -175 -82 -51 -348 -185 -370 -185 -9 0 -53 -14 -97 -31 -45 -17 -86 -29 -92 -27 -6 2 12 28 40 58 66 70 185 226 236 310 22 36 46 74 53 85 7 11 21 38 31 60 10 22 42 88 69 148 35 72 56 107 68 107 9 0 37 -11 63 -24z m-2303 -28 c19 -55 109 -237 138 -281 14 -21 26 -41 26 -45 0 -5 14 -28 32 -53 93 -129 143 -192 202 -254 57 -59 76 -85 62 -85 -2 0 -52 16 -112 35 -97 32 -235 90 -274 115 -8 6 -26 15 -40 20 -14 6 -32 14 -40 20 -8 5 -36 21 -61 34 -108 58 -388 269 -404 305 -12 30 15 46 355 209 25 12 58 20 74 19 24 -2 31 -9 42 -39z"/></g></svg>
            <span class="til-joriy">{{ JORIY_TIL_NOMI }}</span>
            <svg class="til-strelka" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <ul class="til-royxat" role="listbox" aria-label="{% trans 'Tilni tanlang' %}">
            {% for til_kodi, til_nomi in TIL_ROYXATI %}
            <li role="option"
                class="til-band{% if til_kodi == JORIY_TIL_KODI %} tanlangan{% endif %}"
                data-kod="{{ til_kodi }}"
                aria-selected="{% if til_kodi == JORIY_TIL_KODI %}true{% else %}false{% endif %}"
                tabindex="-1">{{ til_nomi }}</li>
            {% endfor %}
        </ul>
    </div>
</form>

<style>
.til-dropdown {
    --til-bg: var(--karta-fon, var(--toza, #ffffff));
    --til-text: var(--matn, var(--siyoh, #221c14));
    --til-ikkinchi: var(--ikkinchi, var(--kul, #8b7f6c));
    --til-accent: var(--asos, var(--tilla, #b08c33));
    --til-accent-matn: var(--asos-matn, #ffffff);
    --til-border: var(--chegara, var(--chiziq, #e5ded0));
    --til-radius: var(--radius, 8px);
    position: relative;
    display: inline-block;
    font-family: var(--sans, inherit);
}
.til-tabiiy {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.til-tugma {
    display: flex; align-items: center; gap: 8px;
    min-width: 90px; padding: 9px 12px;
    border: 1px solid var(--til-border); border-radius: var(--til-radius);
    background: var(--til-bg); color: var(--til-text);
    font: inherit; font-size: .8rem; letter-spacing: .4px;
    cursor: pointer; transition: border-color .2s, box-shadow .2s;
}
.til-tugma:hover { border-color: var(--til-accent); }
.til-tugma:focus-visible { outline: none; border-color: var(--til-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--til-accent) 25%, transparent); }
.til-tugma .til-joriy { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.til-globus { width: 15px; height: 15px; flex-shrink: 0; color: var(--til-ikkinchi); }
.til-strelka { width: 10px; height: 8px; flex-shrink: 0; color: var(--til-ikkinchi); transition: transform .2s; }
.til-tugma[aria-expanded="true"] .til-strelka { transform: rotate(180deg); color: var(--til-accent); }

.til-royxat {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 200;
    min-width: 180px; max-height: 320px; overflow-y: auto;
    margin: 0; padding: 6px; list-style: none;
    background: var(--til-bg); border: 1px solid var(--til-border); border-radius: var(--til-radius);
    box-shadow: 0 16px 40px rgba(0,0,0,.18);
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
}
.til-dropdown.ochiq .til-royxat { opacity: 1; visibility: visible; transform: translateY(0); }

.til-band {
    padding: 9px 12px; font-size: .82rem; color: var(--til-text);
    border-radius: calc(var(--til-radius) - 4px); cursor: pointer;
    transition: background .15s, color .15s;
}
.til-band:hover, .til-band.fokus { background: var(--til-accent); color: var(--til-accent-matn); }
.til-band.tanlangan { color: var(--til-accent); font-weight: 600; }
.til-band.tanlangan:hover, .til-band.tanlangan.fokus { color: var(--til-accent-matn); }

@media (max-width: 700px) {
    .til-tugma { padding: 7px 10px; font-size: .75rem; min-width: 78px; }
    {% comment %}
    Taftish topilmasi: ro'yxat tugma markazi bo'yicha markazlashtirilgan edi
    (left:50%; translateX(-50%)) — tugma sahifaning o'ng chekkasiga yaqin
    joylashgani sababli, kengroq ro'yxat (170px) shu tarzda ekran chekkasidan
    tashqariga chiqib ketardi (butun sahifada 14px keraksiz gorizontal skroll
    hosil qilardi, ba'zi tillar qisman ko'rinmasdi). Endi desktopdagidek
    tugmaning o'ng chetiga tekislanadi — shu kenglikda hech qachon ekrandan
    tashqariga chiqmaydi.
    {% endcomment %}
    .til-royxat { min-width: 170px; max-width: calc(100vw - 24px); }
}
</style>

<script>
(function () {
    // ==================================================================
    // TIL ALMASHTIRISH YADROSI (yagona amalga oshiruv)
    //
    // Sayt sahifalari ham, taklifnoma (shablon) sahifalari ham AYNAN shu
    // funksiyadan foydalanadi — shablonlardagi _skript.html uni
    // window.oqTilSwap orqali chaqiradi. Ilgari ikki joyda ikkita alohida
    // nusxa bor edi va ular bir-biridan uzoqlashib ketgandi (biri langarli,
    // ikkinchisi esa oddiy piksel bo'yicha tiklash) — shuning uchun
    // taklifnoma sahifalarida sirg'alish umuman tuzatilmagan edi.
    //
    // MUAMMONING ASLI. Til almashganda sahifa "sirg'aladi", chunki
    // tarjima matnining uzunligi tillarda har xil: bir xil bo'lim rus
    // tilida 3 qator, o'zbekchada 2 qator bo'lishi mumkin. Ya'ni
    // "umuman qimirlamasin" deyish jismonan imkonsiz — kontent
    // haqiqatan ham boshqacha joylashadi. Shuning uchun maqsad "nol
    // siljish" emas, balki "SEZILMAYDIGAN almashuv".
    //
    // YECHIM — uch qatlam (professional saytlarda shu tarzda ishlanadi):
    //
    //   1) LANGAR (scroll anchoring). Ekranning yuqori qismida turgan
    //      HAQIQIY element (bir nechta zaxira nomzodi bilan birga) eslab
    //      qolinadi, almashuvdan keyin esa aynan o'sha element yana
    //      o'sha balandlikda turadigan qilib skroll to'g'rilanadi.
    //      Shunday qilib foydalanuvchining "o'qiyotgan joyi" saqlanadi,
    //      undan yuqoridagi bo'limlar balandligi o'zgargan bo'lsa ham.
    //      Yopishqoq (position: sticky/fixed) panellar langar bo'la
    //      OLMAYDI: ular skrolldan qat'i nazar doim bir joyda turadi,
    //      shu sabab ular bo'yicha o'lchansa "farq yo'q" degan noto'g'ri
    //      xulosa chiqadi.
    //
    //   2) PARDA (cross-fade). Almashuv qisqa xiralashish ostida
    //      bajariladi. Ko'z xiralashish paytida sodir bo'lgan siljishni
    //      ilg'ay olmaydi — birinchi qatlamdan keyin qolgan mayda
    //      farqlar (masalan tugma matni ikki qatorga o'tib ketishi) shu
    //      bilan butunlay yopiladi. Ayni paytda tarmoq so'rovi ham shu
    //      parda ostida ketadi, ya'ni kutish vaqti ham yashiriladi.
    //
    //   3) TINCHLANISH (settle). Tana almashtirilgandan keyin ham
    //      suratlar va shriftlar yuklanib, joylashuvni yana surib
    //      yuborishi mumkin. Shuning uchun langar bir necha yuz
    //      millisekund davomida har kadrda qayta tekshirilib, joyida
    //      ushlab turiladi. Foydalanuvchi shu orada o'zi skroll qilsa —
    //      darhol to'xtaymiz, unga xalaqit bermaymiz.
    // ==================================================================
    if (!window.oqTilSwap) { (function () {
        var PARDA_ID = 'oq-til-parda';
        var TINCH_MS = 800;   // langarni ushlab turish muddati
        var XAVFSIZLIK_MS = 6000; // parda har qanday holatda shu muddatda ochiladi

        // Foydalanuvchi tizim sozlamasida harakatni kamaytirishni tanlagan
        // bo'lsa (vestibulyar sezuvchanlik, ba'zi qurilmalarda batareya
        // rejimi) — xiralashishni umuman qo'llamaymiz. Bunda langar va
        // tinchlantirish qatlamlari o'z ishini bajaraveradi.
        function harakatKamaytirilganmi() {
            try {
                return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            } catch (e) { return false; }
        }
        var PARDA_MS = harakatKamaytirilganmi() ? 0 : 170;

        function fonRangi() {
            var nomzodlar = [document.body, document.documentElement];
            for (var i = 0; i < nomzodlar.length; i++) {
                if (!nomzodlar[i]) { continue; }
                try {
                    var rang = getComputedStyle(nomzodlar[i]).backgroundColor;
                    if (rang && rang !== 'transparent' && rang.indexOf('rgba(0, 0, 0, 0)') === -1) {
                        return rang;
                    }
                } catch (e) {}
            }
            return '#ffffff';
        }

        // Parda ATAYLAB <html> ga qo'yiladi, <body> ga emas — chunki
        // almashuvda <body> butunlay yangisi bilan almashtiriladi va
        // uning ichidagi har qanday element yo'q bo'lib ketardi.
        function pardaOl() {
            var parda = document.getElementById(PARDA_ID);
            if (!parda) {
                parda = document.createElement('div');
                parda.id = PARDA_ID;
                parda.setAttribute('aria-hidden', 'true');
                parda.style.cssText =
                    'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;' +
                    'opacity:0;pointer-events:none;transition:opacity ' + (PARDA_MS / 1000) + 's linear;';
                document.documentElement.appendChild(parda);
            }
            parda.style.background = fonRangi();
            return parda;
        }

        function yopishqoqmi(el) {
            var node = el;
            while (node && node !== document.body) {
                var holat = '';
                try { holat = getComputedStyle(node).position; } catch (e) {}
                if (holat === 'fixed' || holat === 'sticky') { return true; }
                node = node.parentElement;
            }
            return false;
        }

        // Element manzili: ota elementlar ichidagi indekslar zanjiri.
        // Yangi (boshqa tildagi) hujjatda ham xuddi shu zanjir bo'yicha
        // topiladi — matn o'zgargani bilan tuzilma bir xil qoladi.
        function domYoli(el) {
            var yol = [];
            var node = el;
            while (node && node !== document.body && node.parentElement) {
                yol.unshift(Array.prototype.indexOf.call(node.parentElement.children, node));
                node = node.parentElement;
            }
            return node === document.body ? yol : null;
        }

        function yolBoyicha(ildiz, yol) {
            var node = ildiz;
            for (var i = 0; i < yol.length; i++) {
                if (!node || !node.children || !node.children[yol[i]]) { return null; }
                node = node.children[yol[i]];
            }
            return node;
        }

        // Langar to'g'ri topilganini tekshirish uchun "barmoq izi".
        function belgi(el) {
            return el.tagName + '|' + (typeof el.className === 'string' ? el.className : '');
        }

        var OTKAZ = { SCRIPT: 1, STYLE: 1, LINK: 1, META: 1, NOSCRIPT: 1, BR: 1, SOURCE: 1, TEMPLATE: 1 };

        // Langar nomzodlarini yig'ish.
        //
        // TAFTISH: avval bu ish elementFromPoint() bilan — "ekran
        // tepasida nima turibdi" deb — qilingandi. Muammo shundaki, u
        // eng chuqur elementni qaytaradi va ko'pincha bo'sh joyga
        // tushib, KATTA konteynerni (masalan butun <header>) tanlab
        // qolardi; uning yuqori cheti esa ekrandan 800px yuqorida
        // bo'lishi mumkin. Bunday langar bo'yicha o'lchov noaniq:
        // konteyner ichidagi matn o'zgarsa ham uning cheti qimirlamaydi,
        // ya'ni "farq yo'q" degan noto'g'ri xulosa chiqadi.
        //
        // Endi butun sahifa bo'ylab o'tib, YUQORI CHETI aynan ekran
        // tepasiga eng yaqin turgan elementlar tanlanadi — bu
        // foydalanuvchi ko'rib turgan joyning haqiqiy chegara chizig'i.
        // Bir nechta nomzod saqlanadi: birinchisi yangi hujjatda mos
        // kelmasa (tarjimada tuzilma biroz o'zgargan bo'lsa) — keyingisi.
        function langarlarniYig() {
            var balandlik = window.innerHeight || document.documentElement.clientHeight || 0;
            if (!balandlik) { return []; }
            var nishon = Math.min(80, balandlik * 0.15);
            var pastChegara = balandlik * 0.6;
            var barcha = document.body.querySelectorAll('*');
            var nomzodlar = [];
            for (var i = 0; i < barcha.length; i++) {
                var el = barcha[i];
                if (OTKAZ[el.tagName]) { continue; }
                var r = el.getBoundingClientRect();
                // Juda kichik (ikonka, ajratuvchi chiziq) yoki ko'rinmas
                // elementlar ishonchli langar bo'la olmaydi.
                if (r.width < 40 || r.height < 8) { continue; }
                if (r.top < -8 || r.top > pastChegara) { continue; }
                if (yopishqoqmi(el)) { continue; }
                var yol = domYoli(el);
                if (!yol || !yol.length) { continue; }
                nomzodlar.push({
                    yol: yol,
                    belgi: belgi(el),
                    top: r.top,
                    masofa: Math.abs(r.top - nishon),
                    chuqurlik: yol.length
                });
            }
            // Ekran tepasiga eng yaqini birinchi; teng bo'lsa — DOM'da
            // chuqurrog'i (aniqroq, maydaroq bo'lagi) afzal.
            nomzodlar.sort(function (a, b) {
                return (a.masofa - b.masofa) || (b.chuqurlik - a.chuqurlik);
            });
            return nomzodlar.slice(0, 4);
        }

        // Langarni yangi tanadan topib, uni AYNAN oldingi balandligiga
        // qaytaradigan skrollni qo'llaydi.
        function langarniTikla(langarlar) {
            for (var i = 0; i < langarlar.length; i++) {
                var el = yolBoyicha(document.body, langarlar[i].yol);
                if (!el || belgi(el) !== langarlar[i].belgi) { continue; }
                var farq = el.getBoundingClientRect().top - langarlar[i].top;
                if (Math.abs(farq) > 0.5) { window.scrollTo(0, window.scrollY + farq); }
                return langarlar[i];
            }
            return null;
        }

        function tinchlantir(langar, korsat) {
            if (!langar) { korsat(); return; }
            var boshlandi = Date.now();
            var toxtatildi = false;
            var korsatildi = false;
            var barqaror = 0;

            function korsatBir() {
                if (korsatildi) { return; }
                korsatildi = true;
                korsat();
            }
            // Foydalanuvchi o'zi skroll qilishga urinsa — darhol qo'yib
            // yuboramiz, aks holda uning harakati bilan "kurashgan"
            // bo'lardik.
            function toxtat() { toxtatildi = true; korsatBir(); }
            var hodisalar = ['wheel', 'touchstart', 'keydown'];
            for (var h = 0; h < hodisalar.length; h++) {
                window.addEventListener(hodisalar[h], toxtat, { passive: true });
            }
            function tozala() {
                for (var h2 = 0; h2 < hodisalar.length; h2++) {
                    window.removeEventListener(hodisalar[h2], toxtat);
                }
            }

            function kadr() {
                if (toxtatildi) { tozala(); return; }
                var el = yolBoyicha(document.body, langar.yol);
                if (el && belgi(el) === langar.belgi) {
                    var farq = el.getBoundingClientRect().top - langar.top;
                    if (Math.abs(farq) > 0.5) {
                        window.scrollTo(0, window.scrollY + farq);
                        barqaror = 0;
                    } else {
                        barqaror++;
                    }
                }
                // Uch kadr ketma-ket qimirlamadi — ko'rsatsa bo'ladi.
                // Lekin ushlab turishni davom ettiramiz: kechroq
                // yuklanadigan suratlar hali ham surib yuborishi mumkin.
                if (barqaror >= 3) { korsatBir(); }
                if (Date.now() - boshlandi > TINCH_MS) { korsatBir(); tozala(); return; }
                requestAnimationFrame(kadr);
            }
            requestAnimationFrame(kadr);
        }

        // sozlama.audioId            — ijrodagi <audio> elementi id'si
        //                              (yangi tanaga jonli ko'chiriladi,
        //                              musiqa uzilmasligi uchun)
        // sozlama.almashishdanOldin  — eski tana o'chirilishidan oldin
        //                              chaqiriladi (taymerlarni tozalash)
        window.oqTilSwap = function (tilForma, sozlama) {
            sozlama = sozlama || {};
            if (!window.fetch || !window.DOMParser || !window.requestAnimationFrame) {
                tilForma.submit();
                return;
            }

            var parda = pardaOl();
            // Xiralashish DARHOL boshlanadi, tarmoq so'rovi esa unga
            // parallel ketadi — shu bois kutish vaqti ham ko'rinmaydi.
            parda.offsetHeight;
            parda.style.opacity = '1';

            // Sahifada global "html { scroll-behavior: smooth }" bor:
            // uni vaqtincha o'chiramiz, aks holda har bir to'g'rilash
            // animatsiya bilan sekin bajarilib, ko'zga tashlanardi.
            var eskiSkrollUslubi = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto';

            var joriyScroll = window.scrollY;
            var langarlar = langarlarniYig();

            var yakunlandi = false;
            function yakunla() {
                if (yakunlandi) { return; }
                yakunlandi = true;
                clearTimeout(xavfsizlikTaymeri);
                document.documentElement.style.scrollBehavior = eskiSkrollUslubi;
                parda.style.opacity = '0';
            }
            // Kutilmagan holatda (tarmoq osilib qolsa, brauzer taymerni
            // to'xtatib qo'ysa) parda sahifa ustida qolib ketmasligi
            // kerak — shu sabab so'zsiz ochiladigan zaxira taymer.
            // (Parda "pointer-events: none" bo'lgani uchun u hech qachon
            // bosishga to'sqinlik qilmaydi, faqat ko'rinishni yopadi.)
            var xavfsizlikTaymeri = setTimeout(yakunla, XAVFSIZLIK_MS);

            var kutish = new Promise(function (bajar) { setTimeout(bajar, PARDA_MS); });
            var sorov = fetch(tilForma.action, {
                    method: 'POST',
                    body: new FormData(tilForma),
                    credentials: 'same-origin'
                })
                .then(function () { return fetch(location.href, { credentials: 'same-origin' }); })
                .then(function (javob) {
                    if (!javob.ok) { throw new Error('http-xato'); }
                    return javob.text();
                });

            Promise.all([sorov, kutish]).then(function (natijalar) {
                var yangiHujjat = new DOMParser().parseFromString(natijalar[0], 'text/html');
                document.title = yangiHujjat.title;
                // <html lang="..."> ham yangilanishi kerak — skrin-riderlar
                // va qidiruv tizimlari sahifa tilini shundan oladi.
                if (yangiHujjat.documentElement.lang) {
                    document.documentElement.lang = yangiHujjat.documentElement.lang;
                }
                // Har bir sahifaning o'z uslubi (extra_style) — aks holda
                // yangi til eski sahifa uslubida qolib ketardi.
                var eskiUslub = document.getElementById('oq-uslub');
                var yangiUslub = yangiHujjat.getElementById('oq-uslub');
                if (eskiUslub && yangiUslub) { eskiUslub.textContent = yangiUslub.textContent; }

                var yangiTana = document.adoptNode(yangiHujjat.body);

                if (sozlama.audioId) {
                    var jonliAudio = document.getElementById(sozlama.audioId);
                    if (jonliAudio) {
                        var yangiJoy = yangiTana.querySelector('#' + sozlama.audioId);
                        if (yangiJoy) { yangiJoy.parentNode.replaceChild(jonliAudio, yangiJoy); }
                    }
                }

                if (typeof sozlama.almashishdanOldin === 'function') {
                    sozlama.almashishdanOldin();
                }

                document.body.parentNode.replaceChild(yangiTana, document.body);

                // DOMParser orqali kelgan <script>lar o'z-o'zidan
                // ishlamaydi — ularni qayta yaratib ishga tushiramiz.
                Array.prototype.slice.call(document.body.querySelectorAll('script')).forEach(function (eski) {
                    var yangi = document.createElement('script');
                    for (var si = 0; si < eski.attributes.length; si++) {
                        yangi.setAttribute(eski.attributes[si].name, eski.attributes[si].value);
                    }
                    yangi.textContent = eski.textContent;
                    eski.parentNode.replaceChild(yangi, eski);
                });

                window.scrollTo(0, joriyScroll);
                tinchlantir(langarniTikla(langarlar), yakunla);
            }).catch(function () {
                yakunla();
                tilForma.submit();
            });
        };
    })(); }

    document.querySelectorAll('.til-dropdown').forEach(function (dropdown) {
        var tugma = dropdown.querySelector('.til-tugma');
        var royxat = dropdown.querySelector('.til-royxat');
        var bandlar = Array.prototype.slice.call(dropdown.querySelectorAll('.til-band'));
        var haqiqiySelect = dropdown.querySelector('select');
        var joriySpan = dropdown.querySelector('.til-joriy');
        var tilForma = dropdown.closest('form.til-forma');
        // ".til-qatori" ichidagi forma — bu taklifnoma shablon (preview)
        // sahifasi, uni _skript.html o'zi AJAX bilan boshqaradi. Shu yerda
        // qayta ishlov berilsa, ikkalasi bir vaqtda ishga tushib qoladi.
        var shablonSahifaTili = !!dropdown.closest('.til-qatori');

        if (tilForma && !shablonSahifaTili) {
            haqiqiySelect.addEventListener('change', function () {
                window.oqTilSwap(tilForma, { audioId: 'sayt-musiqa' });
            });
        }

        function ochish() {
            dropdown.classList.add('ochiq');
            tugma.setAttribute('aria-expanded', 'true');
            var tanlangan = dropdown.querySelector('.til-band.tanlangan') || bandlar[0];
            if (tanlangan) { tanlangan.focus(); }
        }
        function yopish(tugmagaQaytar) {
            dropdown.classList.remove('ochiq');
            tugma.setAttribute('aria-expanded', 'false');
            if (tugmagaQaytar) { tugma.focus(); }
        }
        function ochiqmi() { return dropdown.classList.contains('ochiq'); }

        tugma.addEventListener('click', function () {
            if (ochiqmi()) { yopish(false); } else { ochish(); }
        });

        bandlar.forEach(function (band, idx) {
            band.addEventListener('click', function () {
                if (haqiqiySelect.value !== band.dataset.kod) {
                    haqiqiySelect.value = band.dataset.kod;
                    if (joriySpan) { joriySpan.textContent = band.textContent; }
                    haqiqiySelect.dispatchEvent(new Event('change', { bubbles: true }));
                } else {
                    yopish(true);
                }
            });
            band.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    (bandlar[idx + 1] || bandlar[0]).focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    (bandlar[idx - 1] || bandlar[bandlar.length - 1]).focus();
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    band.click();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    yopish(true);
                } else if (e.key === 'Tab') {
                    yopish(false);
                }
            });
        });

        tugma.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                ochish();
            } else if (e.key === 'Escape') {
                yopish(false);
            }
        });

        document.addEventListener('click', function (e) {
            if (ochiqmi() && !dropdown.contains(e.target)) { yopish(false); }
        });
    });
})();
</script>
