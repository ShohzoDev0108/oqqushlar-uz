# Gunicorn jurnal faylini (/opt/oqqushlar/gunicorn.log) aylantiradi —
# bu fayl gunicorn.service'ning --log-file parametri orqali to'g'ridan-
# to'g'ri yoziladi va logrotate sozlanmasa CHEKSIZ o'sadi.
#
# O'RNATISH (serverda, root sifatida):
#   cp dizayn/server/oqqushlar-logrotate.conf /etc/logrotate.d/oqqushlar
#   logrotate -d /etc/logrotate.d/oqqushlar   # sinov (hech narsa o'zgarmaydi, faqat ko'rsatadi)
#   logrotate -f /etc/logrotate.d/oqqushlar   # darhol majburiy aylantirish (tekshirish uchun)
#
# copytruncate ISHLATILMAYDI — u fayl nusxalanayotgan payt bilan
# bo'shatilayotgan payt orasida bir necha qatorni yo'qotishi mumkin.
# O'RNIGA: aylantirgandan keyin gunicorn'ga SIGUSR1 yuboriladi — bu
# gunicorn'ning o'zi tan oladigan signal, u jurnal faylini QAYTA OCHADI
# (https://docs.gunicorn.org/en/stable/signals.html), hech qanday qator
# yo'qolmaydi va xizmat qayta ishga tushmaydi.
/opt/oqqushlar/gunicorn.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 deploy deploy
    postrotate
        systemctl kill -s USR1 oqqushlar.service 2>/dev/null || true
    endscript
}
