# Nginx reverse-proxy konfiguratsiyasi — statik/media fayllarni to'g'ridan-
# to'g'ri xizmat qiladi, qolgan barcha so'rovlarni gunicorn'ga (127.0.0.1:8000)
# proxylaydi. SSL qismlari Certbot tomonidan avtomatik qo'shilgan/boshqariladi.
#
# O'RNATISH (serverda, root sifatida — Certbot SSL sertifikatini
# chiqarishdan OLDIN emas, undan KEYIN qo'llanadi: quyidagi
# "ssl_certificate ...pem" qatorlari fayl hali mavjud bo'lmasa xato
# beradi):
#   cp dizayn/server/oqqushlar-nginx.conf /etc/nginx/sites-available/oqqushlar
#   ln -s /etc/nginx/sites-available/oqqushlar /etc/nginx/sites-enabled/oqqushlar
#   nginx -t
#   systemctl reload nginx
#
# Yangi serverda NOLDAN o'rnatilsa, tartib teskari: avval shu faylning
# SSL qismisiz (faqat "listen 80" bo'limi) versiyasi qo'yiladi, keyin
# `certbot --nginx` ishga tushiriladi — u SSL qatorlarini o'zi qo'shadi
# va faylni shu ko'rinishga keltiradi.
#
# ESLATMA (2026-09-15, 49-band): bu fayl serverda HOZIR ishlab turgan
# haqiqiy konfiguratsiyaning nusxasi (/etc/nginx/sites-available/oqqushlar'dan
# olingan), qo'lda qayta yozilmagan. Symlink va manba fayl nomi serverda
# "oqqushlar" (kengaytirmasiz) — "oqqushlar.uz" emas.

server {
    server_name oqqushlar.uz www.oqqushlar.uz;

    location /static/ {
        alias /opt/oqqushlar/staticfiles/;
    }

    location /media/ {
        alias /opt/oqqushlar/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oqqushlar.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oqqushlar.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.oqqushlar.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = oqqushlar.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name oqqushlar.uz www.oqqushlar.uz;
    return 404; # managed by Certbot
}
